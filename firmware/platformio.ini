; ECE:4880 Lab 1 -- Third Box firmware
; Build:   pio run
; Flash:   pio run --target upload
; Monitor: pio device monitor
;
; If your board is not a generic ESP32 DevKit (WROOM-32), change `board` below.
; Common alternatives: esp32-s3-devkitc-1, lolin32, nodemcu-32s, esp32doit-devkit-v1

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; -Wall/-Wextra: we want the compiler to catch our mistakes, not the demo bench.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4
